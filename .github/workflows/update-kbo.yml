name: Update KBO stats

on:
  schedule:
    - cron: '0 21 * * *'      # 매일 06:00 KST (UTC 21:00) 자동 실행
  workflow_dispatch: {}         # Actions 탭에서 수동 실행 가능

permissions:
  contents: write               # data.json 커밋/푸시 권한

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch KBO stats -> data.json
        run: python scripts/update_kbo.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data.json)" ]; then
            git add data.json
            git commit -m "chore: update KBO stats ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "변경 사항 없음 — 커밋 생략"
          fi
